<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Yamarche</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
      background: #fff;
    }


    /* =========================
       HERO
       ========================= */

    .hero {
      max-width: 750px;
      margin: 35px auto 80px;

      /* 上の黒いバー */
      border-top: 14px solid #111;
    }


    /* 左右のエリア */

    .hero-content {
      display: flex;
      height: 520px;
    }


    /* =========================
       LEFT：Yamarche Logo
       ========================= */

    .hero-logo {
      width: 50%;
      background: #e7839b;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 35px;
    }

    .hero-logo img {
      width: 100%;
      max-width: 330px;
      height: auto;
    }


    /* =========================
       RIGHT
       ========================= */

    .hero-message {
      width: 50%;
      background: #f5f5f5;

      position: relative;
    }


    /* Navigation */

    .hero-message nav {
      position: absolute;
      top: 22px;
      left: 0;

      width: 100%;
      text-align: center;
    }

    .hero-message nav a {
      margin: 0 14px;

      color: #222;
      text-decoration: none;

      font-size: 14px;
    }

    .hero-message nav a:hover {
      text-decoration: underline;
    }


    /* 中央のメッセージ */

    .message-content {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: 90%;
      text-align: center;
    }

    .message-content h1 {
      margin: 0 0 15px;

      font-size: 34px;
      font-weight: normal;
    }

    .message-content p {
      margin: 0 0 35px;

      font-size: 14px;
      line-height: 1.7;
    }


    /* SHOP button */

    .shop-button {
      display: inline-block;

      padding: 13px 35px;

      background: #222;
      color: #fff;

      text-decoration: none;

      font-size: 13px;
      letter-spacing: 2px;
    }

    .shop-button:hover {
      opacity: 0.8;
    }


    /* =========================
       FOOTER
       ========================= */

    footer {
      margin: 0 auto 40px;

      text-align: center;

      font-size: 12px;
      color: #777;
    }


    /* =========================
       Smartphone
       ========================= */

    @media (max-width: 700px) {

      .hero {
        margin: 15px;
      }

      .hero-content {
        display: block;
        height: auto;
      }

      .hero-logo,
      .hero-message {
        width: 100%;
      }

      .hero-logo {
        min-height: 350px;
      }

      .hero-message {
        min-height: 350px;
      }

      .message-content h1 {
        font-size: 28px;
      }

    }

  </style>
</head>


<body>


  <section class="hero">

    <div class="hero-content">


      <!-- LEFT -->

      <div class="hero-logo">

        <img
          src="images/yamarche-logo.png"
          alt="Yamarche">

      </div>


      <!-- RIGHT -->

      <div class="hero-message">


        <nav>

          <a href="shop.html">
            Shop
          </a>

          <a href="about.html">
            About
          </a>

        </nav>


        <div class="message-content">

          <h1>
            Yamarche
          </h1>

          <p>
            yamachemの小さなオンラインマルシェ
          </p>

          <a
            class="shop-button"
            href="shop.html">

            SHOP

          </a>

        </div>


      </div>


    </div>

  </section>


  <footer>

    © 2026 Yamarche

  </footer>


</body>

</html>
